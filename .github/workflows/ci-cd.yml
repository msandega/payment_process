name: Django CI/CD Pipeline

on:
  push:
    branches: [ main, test ]  # Triggers on both branches
  pull_request:
    branches: [ main ]        # PRs only target main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django checks
      env:
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: True
        ALLOWED_HOSTS: localhost
      run: |
        python manage.py check
        echo "✅ Django checks passed"

    - name: Test Docker build
      run: |
        docker build -t payments-api-test .
        echo "✅ Docker build successful"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/test' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to Staging
      run: |
        echo "🚀 Would deploy to staging environment"
        echo "Branch: test"
        echo "Commit: ${{ github.sha }}"

  deploy-production:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to Production
      run: |
        echo "🚀 Would deploy to production environment"
        echo "Branch: main"
        echo "Commit: ${{ github.sha }}"